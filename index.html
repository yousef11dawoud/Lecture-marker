<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827">
<link rel="manifest" href="manifest.json">
<title>Lecture Marker</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:#0b0f14;
  color:#f5f5f5;
}
main{
  max-width:720px;
  margin:auto;
  padding:24px 16px 40px;
}
h1,h2,h3,p{margin:0}
.muted{
  color:#6b7280;
  font-size:14px;
}
button,input,select{font:inherit}
button{
  min-height:44px;
  border-radius:10px;
  border:1px solid #374151;
  background:#1f2937;
  color:white;
  padding:10px 16px;
}
button.primary{
  background:#111827;
  border-color:#4b5563;
}
button.mark{
  font-size:18px;
  font-weight:700;
  padding:14px 20px;
  background:#111827;
}
button.danger{
  color:#ff6b6b;
}
input,select{
  width:100%;
  padding:13px;
  border:1px solid #374151;
  border-radius:10px;
  background:#111827;
  color:white;
}
.grid{
  display:grid;
  gap:10px;
}
.card{
  background:#111827;
  border:1px solid #263241;
  border-radius:14px;
  padding:16px;
}
.actions{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}
.row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}
.clock{
  font-size:52px;
  font-weight:800;
  text-align:center;
  letter-spacing:1px;
  margin:20px 0 8px;
}
.counter{
  text-align:center;
  color:#9ca3af;
  font-weight:700;
  margin-bottom:18px;
}
.speed-row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}
.mark-item{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  padding:10px 0;
  border-bottom:1px solid #263241;
}
.mark-item:last-child{
  border-bottom:0;
}
.subject{
  padding:12px;
  border:1px solid #263241;
  border-radius:10px;
  background:#111827;
}
.subject h3{
  margin-bottom:8px;
}
.lecture{
  margin-top:10px;
}
.lecture button{
  margin-top:8px;
}
@media(max-width:420px){
  .clock{font-size:43px}
  .speed-row{grid-template-columns:1fr}
}
</style>
</head>

<body>
<main id="app"></main>

<script>
(()=>{
const KEY="lecture-marker-v1";
const subjects=["Pharma","Patho","Para","Micro"];
let db=JSON.parse(localStorage.getItem(KEY)||"{}");

const saveDB=()=>{
  localStorage.setItem(KEY,JSON.stringify(db));
};

const fmt=ms=>{
  ms=Math.max(0,Math.floor(ms));
  let s=Math.floor(ms/1000);
  let h=Math.floor(s/3600);
  let m=Math.floor((s%3600)/60);
  s=s%60;
  return [h,m,s].map((x,i)=>i===0?String(x).padStart(2,"0"):String(x).padStart(2,"0")).join(":");
};

const speeds=[1,1.25,1.5,1.6,1.7,1.75,2];

function home(){
  app.innerHTML=`
    <h1>Lecture Marker</h1>
    <p class="muted" style="margin-top:6px">Mark important points during lectures</p>

    <div class="card" style="margin-top:20px">
      <input id="name" placeholder="Lecture name">
      <div style="height:10px"></div>

      <select id="subject">
        ${subjects.map(s=>`<option>${s}</option>`).join("")}
      </select>

      <div style="height:10px"></div>

      <select id="mode">
        <option value="live">Live Lecture — Real Time</option>
        <option value="recorded">Recorded Lecture — Playback Speed</option>
      </select>

      <div style="height:10px"></div>

      <select id="speed">
        ${speeds.map(s=>`<option value="${s}">${s}×</option>`).join("")}
      </select>

      <button class="primary" id="create" style="width:100%;margin-top:12px">
        Start Lecture
      </button>
    </div>

    <div id="lists"></div>
  `;

  const modeEl=document.querySelector("#mode");
  const speedEl=document.querySelector("#speed");

  const updateSpeed=()=>{
    speedEl.disabled=modeEl.value==="live";
  };

  modeEl.onchange=updateSpeed;
  updateSpeed();

  create.onclick=()=>{
    const name=document.querySelector("#name").value.trim();
    if(!name)return alert("Enter lecture name");

    const subject=document.querySelector("#subject").value;
    const mode=modeEl.value;
    const speed=mode==="live"?1:Number(speedEl.value);

    editor(subject,null,{
      name,
      mode,
      speed,
      marks:[]
    });
  };

  drawHomeLists();
}

function drawHomeLists(){
  const lists=document.querySelector("#lists");

  lists.innerHTML=subjects.map(s=>{
    const arr=db[s]||[];

    return `
      <div class="card subject" style="margin-top:14px">
        <h3>${s}</h3>

        ${
          arr.length
          ? arr.map((l,i)=>`
            <div class="lecture">
              <div class="row">
                <span>${escapeHTML(l.name)}</span>
                <span class="muted">${l.marks.length} 🔖</span>
              </div>
              <button data-open="${i}" data-subject="${s}" style="width:100%">
                Open
              </button>
            </div>
          `).join("")
          : `<p class="muted">No lectures yet</p>`
        }
      </div>
    `;
  }).join("");

  lists.querySelectorAll("[data-open]").forEach(btn=>{
    btn.onclick=()=>{
      editor(btn.dataset.subject,Number(btn.dataset.open));
    };
  });
}

function escapeHTML(str){
  return String(str)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function editor(subject,id,data=null){

  if(!db[subject])db[subject]=[];

  let l;

  if(id===null){
    l={
      name:data.name,
      mode:data.mode||"live",
      speed:data.speed||1,
      marks:data.marks||[]
    };
  }else{
    l=db[subject][id];
    l.mode=l.mode||"live";
    l.speed=l.speed||1;
    l.marks=l.marks||[];
  }

  let running=false;
  let elapsed=0;
  let startAt=0;
  let raf=0;
  let speed=Number(l.speed)||1;

  app.innerHTML=`
    <div class="row">
      <button id="back">← Back</button>
      <span class="muted">${subject}</span>
    </div>

    <div class="card" style="margin-top:16px">
      <input id="lectureName" value="${escapeHTML(l.name||"")}">

      <div style="height:10px"></div>

      <select id="mode">
        <option value="live" ${l.mode==="live"?"selected":""}>
          Live Lecture — Real Time
        </option>
        <option value="recorded" ${l.mode==="recorded"?"selected":""}>
          Recorded Lecture — Playback Speed
        </option>
      </select>

      <div style="height:10px"></div>

      <select id="speed">
        ${speeds.map(s=>`
          <option value="${s}" ${Number(l.speed)===s?"selected":""}>
            ${s}× Playback
          </option>
        `).join("")}
      </select>

      <div class="clock" id="clock">00:00:00</div>

      <div class="counter" id="counter">
        🔖 ${l.marks.length} Markers
      </div>

      <div class="actions">
        <button class="primary" id="start">Start</button>
        <button class="mark" id="mark" disabled>🔖 MARK</button>
        <button id="save">Save & Back</button>
      </div>
    </div>

    <div class="card" style="margin-top:16px">
      <div class="row">
        <h3>Markers</h3>
        <span class="muted">${l.marks.length}</span>
      </div>

      <div id="marks"></div>
    </div>

    <div class="card" style="margin-top:16px">
      <button id="delete" class="danger" style="width:100%">
        Delete Lecture
      </button>
    </div>
  `;

  const clock=document.querySelector("#clock");
  const counter=document.querySelector("#counter");
  const start=document.querySelector("#start");
  const mark=document.querySelector("#mark");
  const modeEl=document.querySelector("#mode");
  const speedEl=document.querySelector("#speed");

  const current=()=>{
    if(!running)return elapsed;

    const realElapsed=performance.now()-startAt;

    return elapsed+
      realElapsed*
      (modeEl.value==="live"?1:speed);
  };

  const commitTime=()=>{
    if(running){
      elapsed=current();
      startAt=performance.now();
    }
  };

  const paint=()=>{
    clock.textContent=fmt(current());
    counter.textContent=`🔖 ${l.marks.length} Markers`;

    if(running){
      raf=requestAnimationFrame(paint);
    }
  };

  const drawMarks=()=>{
    const box=document.querySelector("#marks");

    box.innerHTML=l.marks.length
      ? l.marks.map((m,i)=>`
        <div class="mark-item">
          <span>
            <strong>Marker ${i+1}</strong>
            <span class="muted">${fmt(m)}</span>
          </span>
          <button data-del="${i}">Remove</button>
        </div>
      `).join("")
      : `<p class="muted" style="margin-top:12px">No markers yet</p>`;

    box.querySelectorAll("[data-del]").forEach(btn=>{
      btn.onclick=()=>{
        l.marks.splice(Number(btn.dataset.del),1);
        drawMarks();
        counter.textContent=`🔖 ${l.marks.length} Markers`;
      };
    });
  };

  const updateSpeedState=()=>{
    speedEl.disabled=modeEl.value==="live";
  };

  modeEl.onchange=()=>{
    if(running)commitTime();

    if(modeEl.value==="live"){
      speed=1;
      speedEl.value="1";
    }else{
      speed=Number(speedEl.value);
    }

    l.mode=modeEl.value;
    l.speed=speed;

    saveDB();
    paint();
    updateSpeedState();
  };

  speedEl.onchange=()=>{
    if(running)commitTime();

    speed=Number(speedEl.value);
    l.speed=speed;

    saveDB();
    paint();
  };

  start.onclick=()=>{
    if(!running){
      startAt=performance.now();
      running=true;
      start.textContent="Pause";
      mark.disabled=false;
      paint();
    }else{
      elapsed=current();
      running=false;
      start.textContent="Start";
      mark.disabled=true;
      cancelAnimationFrame(raf);
      paint();
    }
  };

  mark.onclick=()=>{
    l.marks.push(current());
    drawMarks();
    counter.textContent=`🔖 ${l.marks.length} Markers`;
  };

  document.querySelector("#lectureName").oninput=e=>{
    l.name=e.target.value;
  };

  document.querySelector("#back").onclick=()=>{
    cancelAnimationFrame(raf);
    home();
  };

  document.querySelector("#save").onclick=()=>{
    l.name=document.querySelector("#lectureName").value.trim()||"Untitled Lecture";
    l.mode=modeEl.value;
    l.speed=modeEl.value==="live"?1:Number(speedEl.value);

    if(id===null){
      db[subject].push(l);
    }

    saveDB();
    home();
  };

  document.querySelector("#delete").onclick=()=>{
    if(id===null){
      home();
      return;
    }

    if(confirm("Delete this lecture?")){
      db[subject].splice(id,1);
      saveDB();
      home();
    }
  };

  drawMarks();
  updateSpeedState();
  paint();
}

home();

})();
</script>
</body>
</html>
