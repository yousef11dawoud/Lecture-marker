<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<meta name="theme-color" content="#0b1f3a">
<link rel="manifest" href="manifest.json">

<title>Lecture Marker</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",
  "SF Pro Text",Arial,sans-serif;
  background:#ffffff;
  color:#0b1f3a;
}

main{
  max-width:720px;
  margin:auto;
  padding:28px 16px 50px;
}

h1{
  margin:0;
  font-size:38px;
  font-weight:800;
  letter-spacing:-1px;
}

h2{
  margin:0;
  font-size:25px;
}

h3{
  margin:0 0 8px;
}

p{
  margin:0;
}

.subtitle{
  color:#718096;
  font-size:16px;
  margin-top:6px;
}

.header{
  margin-bottom:24px;
}

.card{
  background:#f3f8fc;
  border:1px solid #cbdbea;
  border-radius:24px;
  padding:18px;
  margin-top:16px;
  box-shadow:0 5px 18px rgba(11,31,58,.06);
}

input,
select,
button{
  width:100%;
  font:inherit;
  border-radius:16px;
  min-height:52px;
}

input,
select{
  border:1px solid #c5d5e5;
  background:#ffffff;
  color:#0b1f3a;
  padding:14px 16px;
  outline:none;
}

input:focus,
select:focus{
  border-color:#6fa8d6;
  box-shadow:0 0 0 3px rgba(111,168,214,.18);
}

button{
  border:1px solid #c5d5e5;
  background:#ffffff;
  color:#0b1f3a;
  padding:12px 16px;
  font-weight:700;
  cursor:pointer;
}

button:active{
  transform:scale(.98);
}

.primary{
  background:#0b1f3a;
  color:#ffffff;
  border-color:#0b1f3a;
}

.primary:hover{
  background:#102b50;
}

.mark{
  background:#6fa8d6;
  color:#ffffff;
  border-color:#6fa8d6;
  font-size:20px;
  font-weight:800;
  min-height:64px;
}

.mark:hover{
  background:#5d98c8;
}

.danger{
  color:#a61b1b;
  border-color:#e5baba;
  background:#fffafa;
}

.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:12px;
}

.actions .mark{
  grid-column:1 / -1;
}

.row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.label{
  font-size:14px;
  font-weight:800;
  color:#49647f;
  margin-bottom:7px;
}

.field{
  margin-top:12px;
}

.clock{
  text-align:center;
  font-size:58px;
  font-weight:800;
  letter-spacing:-2px;
  color:#0b1f3a;
  padding:18px 0 8px;
  font-variant-numeric:tabular-nums;
}

.modeBadge{
  text-align:center;
  color:#607b96;
  font-size:14px;
  font-weight:700;
  margin-bottom:12px;
}

.counter{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  background:#dcecf8;
  color:#0b1f3a;
  border-radius:999px;
  padding:8px 14px;
  font-weight:800;
  font-size:14px;
}

.markerList{
  margin-top:14px;
}

.markerItem{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  background:#ffffff;
  border:1px solid #d1dfeb;
  border-radius:15px;
  padding:12px 14px;
  margin-top:8px;
}

.markerTime{
  font-weight:800;
  color:#0b1f3a;
}

.markerNumber{
  color:#6b849d;
  font-size:13px;
}

.smallBtn{
  width:auto;
  min-height:38px;
  padding:7px 12px;
  border-radius:12px;
  font-size:13px;
}

.subjectCard{
  background:#ffffff;
  border:1px solid #d1dfeb;
  border-radius:20px;
  padding:18px;
  margin-top:12px;
  cursor:pointer;
}

.subjectCard:active{
  transform:scale(.99);
}

.subjectTitle{
  display:flex;
  align-items:center;
  gap:9px;
  font-size:23px;
  font-weight:800;
}

.empty{
  color:#7a8da1;
  margin-top:7px;
}

.lectureItem{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-top:10px;
  padding:13px;
  background:#f4f8fb;
  border-radius:15px;
  border:1px solid #d8e3ed;
}

.lectureName{
  font-weight:800;
  color:#0b1f3a;
}

.lectureMeta{
  color:#718096;
  font-size:13px;
  margin-top:3px;
}

.backBtn{
  width:auto;
  min-height:42px;
  padding:8px 14px;
  margin-bottom:14px;
}

.tip{
  color:#718096;
  font-size:13px;
  line-height:1.5;
  margin-top:9px;
}

.hidden{
  display:none;
}

@media(max-width:420px){
  main{
    padding:22px 14px 40px;
  }

  h1{
    font-size:34px;
  }

  .clock{
    font-size:47px;
  }

  .card{
    border-radius:21px;
  }
}
</style>
</head>

<body>

<main id="app"></main>

<script>
(() => {

const KEY = "lecture-marker-v1";

const subjects = [
  {
    name:"Pharma",
    emoji:"💊"
  },
  {
    name:"Patho",
    emoji:"🔬"
  },
  {
    name:"Para",
    emoji:"🦠"
  },
  {
    name:"Micro",
    emoji:"🧫"
  }
];

let db = JSON.parse(localStorage.getItem(KEY) || "{}");

function saveDB(){
  localStorage.setItem(KEY, JSON.stringify(db));
}

function escapeHTML(str){
  return String(str ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function fmt(ms){
  ms = Math.max(0, Math.floor(ms));

  const total = Math.floor(ms / 1000);

  const h = Math.floor(total / 3600);
  const m = Math.floor((total % 3600) / 60);
  const s = total % 60;

  return [
    h,
    m,
    s
  ].map((x,i) => i === 0 ? String(x).padStart(2,"0")
    : String(x).padStart(2,"0"))
   .join(":");
}

function uid(){
  return Date.now().toString(36) +
    Math.random().toString(36).slice(2);
}

function home(){

  app.innerHTML = `
    <div class="header">
      <h1>🎓 Lecture Marker</h1>
      <p class="subtitle">
        🔖 Mark important points during lectures
      </p>
    </div>

    <div class="card">

      <div class="field">
        <div class="label">📝 Lecture Name</div>
        <input id="newName"
          placeholder="Enter lecture name">
      </div>

      <div class="field">
        <div class="label">📚 Subject</div>
        <select id="newSubject">
          ${subjects.map(s =>
            `<option value="${s.name}">
              ${s.emoji} ${s.name}
            </option>`
          ).join("")}
        </select>
      </div>

      <div class="field">
        <div class="label">🎥 Lecture Type</div>
        <select id="newMode">
          <option value="live">
            🎙️ Live Lecture — Real Time
          </option>

          <option value="recorded">
            🎥 Recorded Lecture — Playback Speed
          </option>
        </select>
      </div>

      <div class="field">
        <div class="label">⚡ Playback Speed</div>
        <select id="newSpeed">
          <option value="1">1×</option>
          <option value="1.25">1.25×</option>
          <option value="1.5">1.5×</option>
          <option value="1.6">1.6×</option>
          <option value="1.7">1.7×</option>
          <option value="1.75">1.75×</option>
          <option value="2">2×</option>
        </select>

        <p class="tip">
          💡 Choose the same speed you're using in your
          lecture player.
        </p>
      </div>

      <div class="actions">
        <button class="primary" id="startLecture">
          🚀 Start Lecture
        </button>
      </div>

    </div>

    <div id="subjectLists"></div>
  `;

  const mode = document.querySelector("#newMode");
  const speed = document.querySelector("#newSpeed");

  function updateSpeedState(){
    speed.disabled = mode.value !== "recorded";

    if(mode.value === "live"){
      speed.value = "1";
    }
  }

  mode.onchange = updateSpeedState;
  updateSpeedState();

  document.querySelector("#startLecture").onclick = () => {

    const name =
      document.querySelector("#newName").value.trim();

    if(!name){
      alert("📝 Enter a lecture name first.");
      return;
    }

    const subject =
      document.querySelector("#newSubject").value;

    const lecture = {
      id:uid(),
      name,
      subject,
      mode:mode.value,
      speed:Number(speed.value),
      marks:[]
    };

    if(!db[subject]){
      db[subject] = [];
    }

    db[subject].push(lecture);
    saveDB();

    editor(subject, lecture.id);
  };

  drawHomeLists();
}

function drawHomeLists(){

  const container =
    document.querySelector("#subjectLists");

  container.innerHTML = subjects.map(s => {

    const list = db[s.name] || [];

    return `
      <div class="subjectCard">

        <div class="subjectTitle">
          ${s.emoji} ${s.name}
        </div>

        ${
          list.length === 0
          ? `<div class="empty">
               No lectures yet
             </div>`
          : list.map(l => `
              <div class="lectureItem"
                   data-open="${l.id}">

                <div>
                  <div class="lectureName">
                    ${escapeHTML(l.name)}
                  </div>

                  <div class="lectureMeta">
                    ${l.mode === "recorded"
                      ? `🎥 Recorded • ⚡ ${l.speed || 1}×`
                      : `🎙️ Live Lecture`}
                    • 🔖 ${l.marks?.length || 0} markers
                  </div>
                </div>

                <button class="smallBtn">
                  ▶️ Open
                </button>

              </div>
            `).join("")
        }

      </div>
    `;
  }).join("");

  container.querySelectorAll("[data-open]")
    .forEach(item => {

      item.onclick = e => {

        if(e.target.tagName === "BUTTON" ||
           e.target.closest("button")){

          const id = item.dataset.open;
          const subject =
            item.closest(".subjectCard")
              .querySelector(".subjectTitle")
              .textContent
              .trim();

          const found = subjects.find(s =>
            subject.includes(s.name)
          );

          if(found){
            editor(found.name,id);
          }

          return;
        }

        const id = item.dataset.open;

        const foundSubject =
          subjects.find(s =>
            (db[s.name] || []).some(l => l.id === id)
          );

        if(foundSubject){
          editor(foundSubject.name,id);
        }
      };
    });
}

function editor(subject,id){

  const list = db[subject] || [];

  const lecture =
    list.find(x => x.id === id);

  if(!lecture){
    home();
    return;
  }

  lecture.marks ||= [];
  lecture.mode ||= "live";
  lecture.speed ||= 1;

  let running = false;
  let elapsed = 0;
  let startAt = 0;
  let raf = 0;

  function current(){

    if(!running){
      return elapsed;
    }

    return elapsed +
      (performance.now() - startAt) *
      (lecture.mode === "recorded"
        ? lecture.speed
        : 1);
  }

  app.innerHTML = `

    <button class="backBtn" id="back">
      ← Back
    </button>

    <div class="header">
      <h1>🎓 Lecture</h1>
      <p class="subtitle">
        📚 ${escapeHTML(subject)}
      </p>
    </div>

    <div class="card">

      <div class="field">
        <div class="label">📝 Lecture Name</div>
        <input id="lectureName"
          value="${escapeHTML(lecture.name)}">
      </div>

      <div class="field">
        <div class="label">🎥 Lecture Type</div>

        <select id="mode">
          <option value="live"
            ${lecture.mode === "live" ? "selected" : ""}>
            🎙️ Live Lecture — Real Time
          </option>

          <option value="recorded"
            ${lecture.mode === "recorded" ? "selected" : ""}>
            🎥 Recorded Lecture — Playback Speed
          </option>
        </select>
      </div>

      <div class="field">
        <div class="label">⚡ Playback Speed</div>

        <select id="speed">
          ${[
            1,1.25,1.5,1.6,1.7,1.75,2
          ].map(v => `
            <option value="${v}"
              ${Number(lecture.speed) === v ? "selected" : ""}>
              ${v}×
            </option>
          `).join("")}
        </select>
      </div>

      <div class="modeBadge" id="modeBadge">
        ${lecture.mode === "recorded"
          ? `🎥 Recorded • ${lecture.speed}×`
          : `🎙️ Live • Real Time`}
      </div>

      <div class="clock" id="clock">
        00:00:00
      </div>

      <div style="text-align:center">
        <span class="counter" id="counter">
          🔖 0 Markers
        </span>
      </div>

      <div class="actions">

        <button class="primary" id="start">
          ▶️ Start
        </button>

        <button class="mark"
                id="mark"
                disabled>
          🔖 MARK
        </button>

        <button id="save">
          💾 Save & Back
        </button>

      </div>

      <p class="tip">
        💡 For recorded lectures, set the speed to match
        the playback speed you're watching.
      </p>

    </div>

    <div class="card">

      <div class="row">
        <h2>🔖 Markers</h2>

        <span class="counter">
          ${lecture.marks.length}
        </span>
      </div>

      <div class="markerList" id="markers">
      </div>

    </div>

    <div class="card">

      <button class="danger" id="delete">
        🗑️ Delete Lecture
      </button>

    </div>
  `;

  const clock =
    document.querySelector("#clock");

  const start =
    document.querySelector("#start");

  const mark =
    document.querySelector("#mark");

  const speed =
    document.querySelector("#speed");

  const mode =
    document.querySelector("#mode");

  const counter =
    document.querySelector("#counter");

  const markers =
    document.querySelector("#markers");

  const modeBadge =
    document.querySelector("#modeBadge");

  function paint(){

    clock.textContent =
      fmt(current());

    counter.textContent =
      `🔖 ${lecture.marks.length} ${
        lecture.marks.length === 1
        ? "Marker"
        : "Markers"
      }`;

    if(running){
      raf = requestAnimationFrame(paint);
    }
  }

  function commitTime(){

    if(running){
      elapsed = current();
      startAt = performance.now();
    }
  }

  function updateModeUI(){

    speed.disabled =
      mode.value !== "recorded";

    if(mode.value === "live"){
      speed.value = "1";
    }

    modeBadge.textContent =
      mode.value === "recorded"
      ? `🎥 Recorded • ${speed.value}×`
      : `🎙️ Live • Real Time`;
  }

  function drawMarks(){

    if(!lecture.marks.length){

      markers.innerHTML = `
        <div class="empty">
          📝 No markers yet.
        </div>
      `;

      return;
    }

    markers.innerHTML =
      lecture.marks.map((time,index) => `

        <div class="markerItem">

          <div>
            <div class="markerNumber">
              🔖 Marker ${index + 1}
            </div>

            <div class="markerTime">
              ⏱️ ${fmt(time)}
            </div>
          </div>

          <button class="smallBtn danger"
                  data-del="${index}">
            🗑️
          </button>

        </div>

      `).join("");

    markers.querySelectorAll("[data-del]")
      .forEach(btn => {

        btn.onclick = () => {

          const index =
            Number(btn.dataset.del);

          lecture.marks.splice(index,1);

          saveDB();
          drawMarks();
          paint();
        };
      });
  }

  document.querySelector("#back").onclick = () => {

    if(running){
      elapsed = current();
      running = false;
      cancelAnimationFrame(raf);
    }

    saveDB();
    home();
  };

  document.querySelector("#lectureName")
    .oninput = e => {
      lecture.name = e.target.value;
      saveDB();
    };

  mode.onchange = () => {

    if(running){
      commitTime();
    }

    lecture.mode = mode.value;

    if(lecture.mode === "live"){
      lecture.speed = 1;
    }else{
      lecture.speed =
        Number(speed.value);
    }

    saveDB();
    updateModeUI();
    paint();
  };

  speed.onchange = () => {

    if(running){
      commitTime();
    }

    lecture.speed =
      Number(speed.value);

    saveDB();
    updateModeUI();
    paint();
  };

  start.onclick = () => {

    if(!running){

      startAt = performance.now();
      running = true;

      start.textContent =
        "⏸️ Pause";

      mark.disabled = false;

      paint();

    }else{

      elapsed = current();
      running = false;

      cancelAnimationFrame(raf);

      start.textContent =
        "▶️ Start";

      mark.disabled = true;

      paint();
    }
  };

  mark.onclick = () => {

    if(!running) return;

    lecture.marks.push(current());

    saveDB();
    drawMarks();
    paint();
  };

  document.querySelector("#save").onclick = () => {

    if(running){
      elapsed = current();
      running = false;
      cancelAnimationFrame(raf);
    }

    saveDB();
    home();
  };

  document.querySelector("#delete").onclick = () => {

    const ok =
      confirm(
        "🗑️ Delete this lecture and all its markers?"
      );

    if(!ok) return;

    db[subject] =
      (db[subject] || [])
        .filter(x => x.id !== id);

    saveDB();
    home();
  };

  updateModeUI();
  drawMarks();
  paint();
}

home();

})();
</script>

</body>
</html>
